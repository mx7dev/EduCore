<div class="page-header">
  <h2>Grados</h2>
  <p-button label="Nuevo Grado" icon="pi pi-plus" (onClick)="abrirFormulario()" />
</div>

<p-table 
  [value]="grados"
  [loading]="gradosResponse.isLoading()"
  [paginator]="true"
  [rows]="10"
  styleClass="p-datatable-striped">
  
  <ng-template #header>
    <tr>
      <th>Número</th>
      <th>Nivel</th>
    </tr>
  </ng-template>

  <ng-template #body let-grado>
    <tr>
      <td>{{ grado.numero }}°</td>
      <td>{{ grado.nivel }}</td>
    </tr>
  </ng-template>

  <ng-template #empty>
    <tr>
      <td colspan="2" class="text-center">No hay grados registrados</td>
    </tr>
  </ng-template>
</p-table>

<app-grado-form 
  [visible]="mostrarFormulario"
  (visibleChange)="mostrarFormulario = $event"
  (gradoGuardado)="gradosResponse.reload()" />
