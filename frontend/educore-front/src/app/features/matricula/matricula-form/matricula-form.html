<p-toast />
<p-dialog 
  header="Nueva Matrícula"
  [(visible)]="visible"
  [modal]="true"
  [style]="{ width: '500px' }"
  (onHide)="cerrar()">

  <div class="form-grid">
    <div class="field">
      <label>ID del Alumno *</label>
      <input pInputText [formField]="formulario.alumnoId" placeholder="1" class="w-full" />
      @if (formulario.alumnoId().invalid() && formulario.alumnoId().touched()) {
        <small class="error">{{ formulario.alumnoId().errors()[0]?.message }}</small>
      }
    </div>

    <div class="field">
      <label>ID de la Sección *</label>
      <input pInputText [formField]="formulario.seccionId" placeholder="1" class="w-full" />
      @if (formulario.seccionId().invalid() && formulario.seccionId().touched()) {
        <small class="error">{{ formulario.seccionId().errors()[0]?.message }}</small>
      }
    </div>
  </div>

  <ng-template #footer>
    <p-button label="Cancelar" severity="secondary" (onClick)="cerrar()" />
    <p-button label="Guardar" [loading]="guardando" (onClick)="guardar()" />
  </ng-template>
</p-dialog>
