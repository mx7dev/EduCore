<p-toast />
<p-dialog 
  header="Nueva Matrícula"
  [(visible)]="visible"
  [modal]="true"
  [style]="{ width: '500px' }"
  (onHide)="cerrar()">

  <div class="form-grid">
    <div class="field">
      <label>Alumno *</label>
      <p-select 
        [options]="alumnos"
        [(ngModel)]="alumnoSeleccionado"
        optionLabel="label"
        optionValue="value"
        placeholder="Selecciona alumno"
        [loading]="alumnosResponse.isLoading()"
        [filter]="true"
        appendTo="body"
        class="w-full" />
    </div>

    <div class="field">
      <label>Sección *</label>
      <p-select 
        [options]="secciones"
        [(ngModel)]="seccionSeleccionada"
        optionLabel="label"
        optionValue="value"
        placeholder="Selecciona sección"
        [loading]="seccionesResponse.isLoading()"
        appendTo="body"
        class="w-full" />
    </div>
  </div>

  <ng-template #footer>
    <p-button label="Cancelar" severity="secondary" (onClick)="cerrar()" />
    <p-button label="Guardar" [loading]="guardando" (onClick)="guardar()" />
  </ng-template>
</p-dialog>
